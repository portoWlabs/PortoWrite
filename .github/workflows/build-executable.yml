name: Build Windows Executable

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      run: pyinstaller portowrite.spec --noconfirm

    - name: Verify executable exists
      shell: pwsh
      run: |
        $exe = "dist\PortoWrite\PortoWrite.exe"
        if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
        Write-Host "Executable size: $((Get-Item $exe).Length) bytes"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortoWrite-windows
        path: dist/PortoWrite/
        retention-days: 30

    # --- Release steps (tag pushes only) ---

    - name: Build Inno Setup installer
      if: startsWith(github.ref, 'refs/tags/')
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.4
      with:
        path: portowrite-installer.iss

    - name: Create portable zip
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        Compress-Archive -Path "dist\PortoWrite\*" -DestinationPath "PortoWrite-$tag-portable.zip"

    - name: Publish release assets
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          Output/PortoWrite-setup.exe
          PortoWrite-${{ github.ref_name }}-portable.zip
